    <script>
      // Gracefully ignore Vite HMR WebSocket connection errors in sandboxed iframe environment
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('@vite/client') || e.message.includes('createWebSocketModuleRunnerTransport'))) {
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        var msg = (e.reason && (e.reason.message || String(e.reason))) || '';
        if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('createWebSocketModuleRunnerTransport')) {
          e.preventDefault();
        }
      });
    </script>
  </head>

  </body>
