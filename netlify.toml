[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route API endpoints directly to their corresponding Netlify Functions
[[redirects]]
  from = "/api/analyze-form"
  to = "/.netlify/functions/analyze-form"
  status = 200
  force = true

[[redirects]]
  from = "/api/generate-filled-pdf"
  to = "/.netlify/functions/generate-filled-pdf"
  status = 200
  force = true

# Fallback for Single Page App client routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
